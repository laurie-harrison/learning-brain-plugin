interface:
  display_name: "ELT Brain"
  short_description: "Evidence-grounded ELT writing and audit workflows"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/logo.svg"
  brand_color: "#b8860b"
  default_prompt: "Use $learning-brain-elt to design, write, or audit ELT material with ELT Brain and its workflow discipline."

dependencies:
  tools:
    - type: "mcp"
      value: "learning-brain-elt"
      description: "ELT Brain MCP server"
      transport: "streamable_http"
      url: "https://eltbrain.com/mcp"

policy:
  allow_implicit_invocation: true
